name: Staqtapp-TDS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staqtapp-tds-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-package:
    name: Source and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Validate source version
        run: python scripts/release_version.py
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_pypi_readme.py --wheel dist/*.whl
      - name: Verify the wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/tds-ci-wheel"
          python -m venv "$smoke_root"
          "$smoke_root/bin/python" -m pip install dist/*.whl
          "$smoke_root/bin/python" -m pip check
          "$smoke_root/bin/python" -I scripts/release_version.py --verify-installed
          "$smoke_root/bin/python" -I - <<'PY'
          from staqtapp_tds import TDSFileSystem

          fs = TDSFileSystem("wheel_smoke")
          node = fs.makedirs("/package")
          node.write_text("status", "installed")
          assert node.read_value("status") == "installed"
          PY

  python-tests:
    name: Python ${{ matrix.python-version }} full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run the full suite
        run: python -m pytest -q --disable-warnings

  python-compatibility:
    name: Python ${{ matrix.python-version }} install and import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install and verify package identity
        run: |
          python -m pip install .
          python -m pip check
          python -I scripts/release_version.py --verify-installed
      - name: Run a core installed-package round trip
        run: >-
          python -I -c
          "from staqtapp_tds import TDSFileSystem;
          fs = TDSFileSystem('compatibility_smoke');
          node = fs.makedirs('/runtime');
          node.write_text('status', 'ready');
          assert node.read_value('status') == 'ready'"

  platform-tests:
    name: ${{ matrix.os }} Python 3.13 full suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run the full suite
        run: python -m pytest -q --disable-warnings

  native-full-suite:
    name: Ubuntu Python 3.13 native full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Build and install native extensions
        run: python -m pip install ".[test]"
      - name: Require both native modules
        run: >-
          python -I -c
          "from staqtapp_tds import _native_index, _csv_scan_kernel;
          assert _native_index and _csv_scan_kernel"
      - name: Run the full suite with native extensions
        run: python -m pytest -q --disable-warnings -c /dev/null tests

  native-abi-smoke:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} native ABI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: macos-14
            python-version: '3.13'
          - os: ubuntu-24.04-arm
            python-version: '3.13'
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install native extensions
        run: python -m pip install ".[test]"
      - name: Require both native ABIs
        run: >-
          python -I -c
          "from staqtapp_tds import _native_index, _csv_scan_kernel;
          assert _native_index and _csv_scan_kernel"
      - name: Run focused native contracts
        run: >-
          python -m pytest -q --disable-warnings -c /dev/null
          tests/test_v360_native_lifecycle_admission.py
          tests/test_v360_native_csv_input_safety.py
