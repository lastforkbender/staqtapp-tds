name: Publish v3.7.0 GitHub Release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v370-github-release-once.yml

permissions:
  contents: write

concurrency:
  group: publish-v370-github-release-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Require the immutable tag and public PyPI artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          git rev-parse --verify refs/tags/v3.7.0
          curl -fsSL https://pypi.org/pypi/staqtapp-tds/3.7.0/json > /tmp/pypi.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/pypi.json').read_text())
          assert payload['info']['version'] == '3.7.0'
          assert {item['packagetype'] for item in payload['urls']} == {'bdist_wheel', 'sdist'}
          PY
          test -f .github/V370_RELEASE_NOTES.md
      - name: Remove this one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v370-github-release-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed v3.7.0 GitHub Release controller'
          git push origin HEAD:main
      - name: Publish the permanent GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.7.0 >/dev/null 2>&1; then
            echo 'GitHub Release v3.7.0 already exists'
          else
            gh release create v3.7.0 \
              --verify-tag \
              --title 'Staqtapp-TDS v3.7.0 — Atomic Generation Authority' \
              --notes-file .github/V370_RELEASE_NOTES.md \
              --latest
          fi
