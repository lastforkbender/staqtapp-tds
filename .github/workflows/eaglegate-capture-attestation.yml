name: Staqtapp-TDS Eaglegate capture witness attestation

on:
  pull_request:
    branches:
      - agent/eaglegate-offline-capability-capture
  push:
    branches:
      - agent/eaglegate-capture-witness-receipts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaglegate-capture-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-attestation-contract:
    name: Capture attestation contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e .[test]
      - name: Compile the complete Eaglegate package
        run: python -m compileall -q src/staqtapp_tds/eaglegate
      - name: Run accumulated Eaglegate and install contracts
        run: >-
          python -m pytest -q
          tests/test_v380_eaglegate_lossless_foundation.py
          tests/test_v380_eaglegate_workflow_contract.py
          tests/test_v380_eaglegate_exactness_laboratory.py
          tests/test_v380_eaglegate_exactness_workflow_contract.py
          tests/test_v380_eaglegate_adapter_conformance.py
          tests/test_v380_eaglegate_adapter_workflow_contract.py
          tests/test_v380_eaglegate_vllm_shadow.py
          tests/test_v380_eaglegate_vllm_shadow_workflow_contract.py
          tests/test_v380_eaglegate_offline_capture.py
          tests/test_v380_eaglegate_offline_capture_workflow_contract.py
          tests/test_v380_eaglegate_capture_attestation.py
          tests/test_v380_eaglegate_capture_attestation_workflow_contract.py
          tests/test_install_contract.py
      - name: Generate deterministic content-free attestation evidence twice
        shell: bash
        run: |
          set -euo pipefail
          python -m staqtapp_tds.eaglegate.capture_attestation_suite --json > attestation-a.json
          python -m staqtapp_tds.eaglegate.capture_attestation_suite --json > attestation-b.json
          cmp attestation-a.json attestation-b.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("attestation-a.json").read_text(encoding="utf-8"))
          if report.get("passed") is not True:
              raise SystemExit("capture attestation report did not pass")
          if report.get("check_count") != 10:
              raise SystemExit("capture attestation catalog changed unexpectedly")
          expected_false = (
              "runtime_imported_by_tds",
              "network_connection_created_by_tds",
              "request_submitted_by_tds",
              "model_invoked",
              "inference_performed",
              "token_acceptance_authority",
              "kv_commit_authority",
              "cryptographic_signature_verified",
              "witness_independence_proven",
              "metadata_truth_claimed",
              "activation_authority",
              "real_runtime_qualified",
          )
          widened = [name for name in expected_false if report.get(name) is not False]
          if widened:
              raise SystemExit(f"capture attestation authority widened: {widened}")
          forbidden = {
              "prompt", "prompt_text", "tokens", "token_sequence", "logits",
              "logits_payload", "hidden_states", "kv_tensor", "kv_tensors",
              "private_key", "secret_key",
          }

          def keys(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield key
                      yield from keys(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from keys(item)

          leaked = sorted(forbidden.intersection(keys(report)))
          if leaked:
              raise SystemExit(f"content-bearing evidence keys present: {leaked}")
          print(report["report_root"])
          PY
      - name: Prove attestation has no runtime network crypto or subprocess import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/staqtapp_tds/eaglegate/capture_attestation.py").read_text(
              encoding="utf-8"
          )
          tree = ast.parse(source)
          forbidden = {
              "vllm", "torch", "requests", "urllib", "socket", "subprocess",
              "http", "http.client", "cryptography", "nacl",
          }
          found = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.extend(alias.name for alias in node.names if alias.name in forbidden)
              elif isinstance(node, ast.ImportFrom) and node.module in forbidden:
                  found.append(node.module)
          if found:
              raise SystemExit(
                  f"forbidden runtime or crypto imports: {sorted(set(found))}"
              )
          PY
      - name: Archive capture attestation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eaglegate-capture-attestation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            attestation-a.json
            attestation-b.json
          if-no-files-found: warn

  capture-attestation-gates-complete:
    name: Eaglegate capture attestation gates complete
    if: always()
    needs:
      - capture-attestation-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every capture attestation lane
        env:
          ATTESTATION_RESULT: ${{ needs.capture-attestation-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ATTESTATION_RESULT" = "success"
