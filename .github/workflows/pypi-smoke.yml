name: Production PyPI smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Staqtapp-TDS version already published to production PyPI
        required: true
      qualified_sha:
        description: Exact qualified commit SHA that the release tag must peel to
        required: true
      qualified_run_id:
        description: Exact successful main release-gates workflow run ID
        required: true
      release_run_id:
        description: Exact parent release workflow run that requested this smoke
        required: true
      tag_object_sha:
        description: Exact controller-attested annotated tag object SHA
        required: true

permissions:
  actions: read
  contents: read

jobs:
  validate-release-identity:
    name: Validate production release identity
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      QUALIFIED_SHA: ${{ inputs.qualified_sha }}
      QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      ATTESTED_TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
      SMOKE_REF: ${{ github.ref }}
      SMOKE_SHA: ${{ github.sha }}
      SMOKE_RUN_ID: ${{ github.run_id }}
      SMOKE_RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      # actions/checkout v7.0.1; preserve the annotated tag object for peeling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v6.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Bind version input, tag ref, source, SHA, and parent run IDs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release_version.py --check-tag "$RELEASE_VERSION"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$RELEASE_VERSION"
          test "$GITHUB_SHA" = "$QUALIFIED_SHA"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "${GITHUB_REF}^{}")" = "$QUALIFIED_SHA"
          [[ "$QUALIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$QUALIFIED_RUN_ID" != "$GITHUB_RUN_ID"
          test "$RELEASE_RUN_ID" != "$GITHUB_RUN_ID"
          python scripts/v382_smoke_provenance.py

  install-from-pypi:
    name: ${{ matrix.os }} production PyPI install
    needs: validate-release-identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.13'
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v6.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate public release identity
        shell: bash
        run: python scripts/release_version.py --check-tag "$RELEASE_VERSION"
      - name: Install exact release from production PyPI
        run: >-
          python -c "import os, subprocess, sys; version = os.environ['RELEASE_VERSION'].removeprefix('v'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--no-cache-dir', '--only-binary=:all:', '--index-url', 'https://pypi.org/simple', f'staqtapp-tds=={version}'])"
      - name: Verify installed version and core round trip
        run: >-
          python -I -c "import importlib.metadata as metadata, os; from staqtapp_tds import TDSFileSystem, __version__; expected = os.environ['RELEASE_VERSION'].removeprefix('v'); assert metadata.version('staqtapp-tds') == expected; assert __version__ == expected; fs = TDSFileSystem('pypi_smoke'); node = fs.makedirs('/release'); node.write_text('status', 'published'); assert node.read_value('status') == 'published'; print(f'staqtapp-tds {expected} production smoke passed')"

  verify-pypi-presentation:
    name: Live PyPI description and links
    needs: validate-release-identity
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v6.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Validate public release identity
        run: python scripts/release_version.py --check-tag "$RELEASE_VERSION"
      - name: Verify live description, screenshots, PDFs, and documentation links
        run: python scripts/verify_pypi_presentation.py --version "$RELEASE_VERSION"

  smoke-complete:
    name: Production PyPI smoke complete
    if: always()
    needs:
      - validate-release-identity
      - install-from-pypi
      - verify-pypi-presentation
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform installs and presentation checks
        env:
          IDENTITY_RESULT: ${{ needs.validate-release-identity.result }}
          INSTALL_RESULT: ${{ needs.install-from-pypi.result }}
          PRESENTATION_RESULT: ${{ needs.verify-pypi-presentation.result }}
        run: >-
          test "$IDENTITY_RESULT" = success &&
          test "$INSTALL_RESULT" = success &&
          test "$PRESENTATION_RESULT" = success
