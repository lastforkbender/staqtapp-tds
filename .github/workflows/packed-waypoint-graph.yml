name: Staqtapp-TDS v3.8 packed waypoint graph

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/v380-phase1-phase4-convergence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v380-packed-waypoint-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-graph:
    name: Packed graph (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e .[test]
      - name: Compile Trace Rank packed graph package
        run: python -m compileall -q src/staqtapp_tds/trace_rank
      - name: Run ABI, Generation, packed graph, workflow, and install gates
        run: >-
          python -m pytest -q
          tests/test_v360_trace_rank_contract.py
          tests/test_v370_csv_generation.py
          tests/test_v380_packed_waypoint_graph.py
          tests/test_v380_packed_waypoint_graph_workflow_contract.py
          tests/test_install_contract.py

  packed-graph-gates-complete:
    name: TDS v3.8 packed waypoint graph gates complete
    if: always()
    needs:
      - packed-graph
    runs-on: ubuntu-24.04
    steps:
      - name: Require every packed graph lane
        env:
          RESULT: ${{ needs.packed-graph.result }}
        run: test "$RESULT" = "success"
