name: Apply bounded v3.7 contract correction

on:
  push:
    branches:
      - agent/v370-atomic-csv-generations
    paths:
      - '.github/workflows/apply-v370-contract-fix.yml'

permissions:
  contents: write

jobs:
  correct-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v370-atomic-csv-generations
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_v370_csv_generation_contract.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'limits = _limits(max_source_bytes=8)\n':
                  'limits = _limits(max_source_bytes=8, max_chunk_bytes=8)\n',
              '    assert "old complete generation or" in contract\n':
                  '    assert "old complete generation" in contract\n'
                  '    assert "new complete generation" in contract\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one exact contract-test target: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/apply-v370-contract-fix.yml
          git add tests/test_v370_csv_generation_contract.py
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-v370-contract-fix.yml' 'tests/test_v370_csv_generation_contract.py' | sort)"
          test "$changed" = "$expected"
      - name: Run contract qualification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install pytest numpy PyQt5
          python -m pytest -q --disable-warnings tests/test_v370_csv_generation_contract.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit corrected contract candidate
        run: |
          git config user.name 'staqtapp-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Correct v3.7 CSV generation contract tests'
          git push origin HEAD:agent/v370-atomic-csv-generations
