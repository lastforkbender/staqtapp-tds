name: Tag v3.7.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-v370-once.yml

permissions:
  contents: write

concurrency:
  group: tag-v370-once
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify the exact release-closing source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NUMBA_DISABLE_JIT: '1'
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/v3.7.0 >/dev/null; then
            echo 'v3.7.0 already exists' >&2
            exit 1
          fi
          grep -F '__version__ = "3.7.0"' src/staqtapp_tds/version.py
          grep -F '# Staqtapp-TDS v3.7.0' README.md
          grep -F '# Staqtapp-TDS v3.7.0' README_ja.md
          grep -F 'python -m pip install staqtapp-tds==3.7.0' README.md
          python -m pip install -e ".[test]"
          python -m pytest -q \
            tests/test_v370_release_closure.py \
            tests/test_v370_generation_convergence.py \
            tests/test_v370_csv_generation_contract.py \
            tests/test_v370_csv_generation_store.py \
            tests/test_v360_foundation_closure.py \
            tests/test_release_version_policy.py \
            tests/test_install_contract.py
          python scripts/check_release.py
          python scripts/release_version.py --check-tag v3.7.0
      - name: Remove the one-shot controller and create the exact tag
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tag-v370-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed v3.7.0 tag controller'
          git push origin HEAD:main
          git tag -a v3.7.0 -m 'Staqtapp-TDS v3.7.0 Atomic Generation Authority'
          git push origin v3.7.0
