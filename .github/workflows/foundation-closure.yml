name: Staqtapp-TDS v3.6 Foundation Closure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/v360-foundation-closure-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v360-foundation-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: Foundation source contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e .[test]
      - name: Compile Foundation Closure package
        run: python -m compileall -q src/staqtapp_tds/native
      - name: Run closure, version, lifecycle, architecture, and release contracts
        run: >-
          python -m pytest -q
          tests/test_v360_foundation_closure.py
          tests/test_release_version_policy.py
          tests/test_v360_native_lifecycle_admission.py
          tests/test_v360_native_architecture_parity.py
          tests/test_v301_release_pipeline.py
          tests/test_v353_release_qualification.py
          tests/test_install_contract.py
      - name: Generate deterministic closure evidence twice
        shell: bash
        run: |
          set -euo pipefail
          python -m staqtapp_tds.native.foundation --root . --json > foundation-a.json
          python -m staqtapp_tds.native.foundation --root . --json > foundation-b.json
          cmp foundation-a.json foundation-b.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("foundation-a.json").read_text(encoding="utf-8"))
          if report.get("passed") is not True:
              raise SystemExit("Foundation Closure report did not pass")
          if report.get("release_identity") != "3.6.0":
              raise SystemExit("Foundation Closure release identity is not 3.6.0")
          if report.get("eaglegate_included") is not False:
              raise SystemExit("Foundation Closure incorrectly included Eaglegate")
          if report.get("atomic_generation_plane_included") is not False:
              raise SystemExit("Foundation Closure incorrectly included generations")
          performance = report.get("performance_claim", {})
          if performance.get("named_reference_cpu_claim") is not False:
              raise SystemExit("named-reference CPU claim widened")
          if performance.get("universal_scaling_claim") is not False:
              raise SystemExit("universal scaling claim widened")
          for field in (
              "storage_authority", "semantic_authority", "model_authority",
              "policy_authority", "activation_authority", "release_authority",
              "browser_authority",
          ):
              if report.get(field) is not False:
                  raise SystemExit(f"authority widened: {field}")
          print(report["report_root"])
          PY
      - name: Archive Foundation Closure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v360-foundation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            foundation-a.json
            foundation-b.json
          if-no-files-found: warn

  native-source-contract:
    name: Native source contract (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install minimal native build dependencies
        run: python -m pip install setuptools wheel pytest
      - name: Build strict native extensions in tree
        run: python setup.py build_ext --inplace --force
      - name: Require exact architecture and closure audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.architecture }}'
          PYTHONPATH=src python -m staqtapp_tds.native.foundation --root . --json > foundation-native.json
          PYTHONPATH=src python -m pytest -q \
            tests/test_v360_foundation_closure.py \
            tests/test_v360_native_lifecycle_admission.py \
            tests/test_v360_native_architecture_parity.py
      - name: Archive native closure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v360-foundation-native-${{ matrix.architecture }}
          path: foundation-native.json
          if-no-files-found: warn

  foundation-gates-complete:
    name: TDS v3.6 Foundation Closure gates complete
    if: always()
    needs:
      - source-contract
      - native-source-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Foundation Closure lane
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          NATIVE_RESULT: ${{ needs.native-source-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
