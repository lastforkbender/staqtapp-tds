name: Staqtapp-TDS AArch64 hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/v360-aarch64-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarch64-hardening-${{ github.ref }}
  cancel-in-progress: false

env:
  STAQTAPP_TDS_BUILD_NATIVE: '1'
  CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'

jobs:
  aarch64-native-soak:
    name: AArch64 native deterministic soak
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Record native ARM runner identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a | tee aarch64-runner.log
          uname -m | tee -a aarch64-runner.log
          python -VV 2>&1 | tee -a aarch64-runner.log
          gcc --version | tee -a aarch64-runner.log
          getconf LONG_BIT | tee -a aarch64-runner.log
          lscpu | tee -a aarch64-runner.log
      - name: Build strict native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel pytest
          python setup.py build_ext --inplace --force
      - name: Run deterministic native ARM soak
        shell: bash
        run: |
          set -euo pipefail
          python -S tools/aarch64_hardening_v360.py \
            --expected-architecture aarch64 \
            --loops 256 \
            --keys 8192 \
            --workers 4 \
            --iterations 128 \
            --output aarch64-hardening.json \
            2>&1 | tee aarch64-hardening.log
      - name: Run ARM hardening and architecture contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --disable-warnings -c /dev/null \
            tests/test_v360_aarch64_hardening.py \
            tests/test_v360_native_architecture_parity.py
      - name: Compile and run ARM subinterpreter rejection harness
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 $(python3-config --cflags) \
            -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
            tools/subinterpreter_v360_native_admission.c \
            -o /tmp/subinterpreter-v360-aarch64 \
            $(python3-config --embed --ldflags)
          /tmp/subinterpreter-v360-aarch64
      - name: Archive native ARM soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-native-soak
          path: |
            aarch64-runner.log
            aarch64-hardening.log
            aarch64-hardening.json
          if-no-files-found: warn

  aarch64-sanitizers:
    name: AArch64 native ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      STAQTAPP_TDS_SANITIZE: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build sanitized native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Run bounded ARM sanitizer soak
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STAQTAPP_TDS_SANITIZE" == "address" ]]; then
            asan_runtime="$(gcc -print-file-name=libasan.so)"
            test -n "$asan_runtime"
            LD_PRELOAD="$asan_runtime" \
              ASAN_OPTIONS="detect_leaks=0:halt_on_error=1:abort_on_error=1" \
              python -S tools/aarch64_hardening_v360.py \
                --expected-architecture aarch64 \
                --loops 16 \
                --keys 1024 \
                --workers 2 \
                --iterations 16 \
                --output aarch64-address.json \
                2>&1 | tee aarch64-address.log
          else
            UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              python -S tools/aarch64_hardening_v360.py \
                --expected-architecture aarch64 \
                --loops 16 \
                --keys 1024 \
                --workers 2 \
                --iterations 16 \
                --output aarch64-undefined.json \
                2>&1 | tee aarch64-undefined.log
          fi
      - name: Archive ARM sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-${{ matrix.sanitizer }}-sanitizer
          path: |
            aarch64-${{ matrix.sanitizer }}.log
            aarch64-${{ matrix.sanitizer }}.json
          if-no-files-found: warn

  aarch64-thread-sanitizer:
    name: AArch64 frozen-index thread sanitizer
    runs-on: ubuntu-24.04-arm
    env:
      STAQTAPP_TDS_SANITIZE: thread
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build ThreadSanitizer native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Run direct extension-only ARM concurrency harness
        shell: bash
        run: |
          set -euo pipefail
          tsan_runtime="$(gcc -print-file-name=libtsan.so)"
          test -n "$tsan_runtime"
          LD_PRELOAD="$tsan_runtime" \
            TSAN_OPTIONS="halt_on_error=1:history_size=7:second_deadlock_stack=1" \
            PYTHONPATH=src python -S tools/tsan_v360_frozen_index.py \
            2>&1 | tee aarch64-thread-sanitizer.log
      - name: Archive ARM ThreadSanitizer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-thread-sanitizer
          path: aarch64-thread-sanitizer.log
          if-no-files-found: warn

  aarch64-deterministic-fuzz:
    name: AArch64 deterministic native format fuzz
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build strict native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Replay pinned ARM valid and malformed cases
        shell: bash
        run: |
          set -euo pipefail
          python -S tools/aarch64_fuzz_v360.py \
            --expected-architecture aarch64 \
            --seed 36018 \
            --cases 10000 \
            --output aarch64-native-fuzz.json \
            2>&1 | tee aarch64-native-fuzz.log
      - name: Archive ARM fuzz evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-native-fuzz
          path: |
            aarch64-native-fuzz.log
            aarch64-native-fuzz.json
          if-no-files-found: warn

  aarch64-performance-evidence:
    name: AArch64 frozen-index scaling evidence
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build strict native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Record hosted ARM scaling distributions
        shell: bash
        run: |
          set -euo pipefail
          lscpu | tee aarch64-performance-runner.log
          python -S tools/aarch64_benchmark_v360.py \
            --expected-architecture aarch64 \
            --keys 4096 \
            --iterations 128 \
            --samples 9 \
            --min-two-worker-factor 1.0 \
            --min-four-worker-factor 1.0 \
            --output aarch64-performance.json \
            2>&1 | tee aarch64-performance.log
      - name: Archive separate ARM performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-performance
          path: |
            aarch64-performance-runner.log
            aarch64-performance.log
            aarch64-performance.json
          if-no-files-found: warn

  aarch64-hardening-complete:
    name: AArch64 hardening gates complete
    if: always()
    needs:
      - aarch64-native-soak
      - aarch64-sanitizers
      - aarch64-thread-sanitizer
      - aarch64-deterministic-fuzz
      - aarch64-performance-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Bind and require every ARM hardening lane
        env:
          SOAK_RESULT: ${{ needs.aarch64-native-soak.result }}
          SANITIZER_RESULT: ${{ needs.aarch64-sanitizers.result }}
          THREAD_RESULT: ${{ needs.aarch64-thread-sanitizer.result }}
          FUZZ_RESULT: ${{ needs.aarch64-deterministic-fuzz.result }}
          PERFORMANCE_RESULT: ${{ needs.aarch64-performance-evidence.result }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = {
              "native_soak": os.environ["SOAK_RESULT"],
              "sanitizers": os.environ["SANITIZER_RESULT"],
              "thread_sanitizer": os.environ["THREAD_RESULT"],
              "deterministic_fuzz": os.environ["FUZZ_RESULT"],
              "performance_evidence": os.environ["PERFORMANCE_RESULT"],
          }
          failed = {
              name: result
              for name, result in results.items()
              if result != "success"
          }
          evidence = {
              "format": "tds.v360.aarch64-hardening-gates.v1",
              "results": results,
              "passed": not failed,
              "functional_authority": False,
              "activation_authority": False,
          }
          Path("aarch64-hardening-gates.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(evidence, sort_keys=True, indent=2))
          if failed:
              raise SystemExit(f"AArch64 hardening gates failed: {failed}")
          PY
      - name: Archive ARM aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-hardening-gates
          path: aarch64-hardening-gates.json
          if-no-files-found: error
