name: Remove v3.7 placeholder from v3.6 branch

on:
  push:
    branches:
      - agent/v360-foundation-closure

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v360-foundation-closure
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v370-placeholder
          rm -f .github/workflows/cleanup-v360-v370-placeholder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove v3.7 placeholder from v3.6 branch'
          git push origin HEAD:agent/v360-foundation-closure
