name: Apply verified v3.6 native lifecycle admission repair

on:
  push:
    branches:
      - agent/v360-native-lifecycle-admission
    paths:
      - '.github/native-lifecycle-admission.patch.gz.b64'
      - '.github/workflows/apply-v360-native-lifecycle-admission.yml'

permissions:
  contents: write

concurrency:
  group: apply-v360-native-lifecycle-admission
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v360-native-lifecycle-admission
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and stage the exact lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            'f66369556d8d2b6bcb5205b4f973a9d436461613' HEAD
          tr -d '\r\n' < .github/native-lifecycle-admission.patch.gz.b64 \
            > /tmp/v360-native-lifecycle-admission.patch.gz.b64
          printf '%s  %s\n' \
            '8e005f4122161c6eb530bd423ef47593ff97497ea449bcf0e287816aa88807ff' \
            '/tmp/v360-native-lifecycle-admission.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/v360-native-lifecycle-admission.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/v360-native-lifecycle-admission.patch
          printf '%s  %s\n' \
            '1a64d325121d3c3325acb94de22730a18a72c0074fbbf80a54793ec24d6de2fd' \
            '/tmp/v360-native-lifecycle-admission.patch' | sha256sum -c -
          git apply --check /tmp/v360-native-lifecycle-admission.patch
          git apply --index /tmp/v360-native-lifecycle-admission.patch
          git rm .github/native-lifecycle-admission.patch.gz.b64
          python - <<'PY'
          import subprocess

          expected = {
              '.github/native-lifecycle-admission.patch.gz.b64',
              'DEV16_NATIVE_LIFECYCLE_ADMISSION_STATUS.txt',
              'docs/126_v360_Native_Lifecycle_Admission_Truth.md',
              'src/staqtapp_tds/_native_index.c',
              'src/staqtapp_tds/native/manager.py',
              'tests/test_v360_native_lifecycle_admission.py',
              'tools/free_threaded_v360_native_admission.py',
              'tools/subinterpreter_v360_native_admission.c',
          }
          staged = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'],
                  text=True,
              ).splitlines()
          )
          if staged != expected:
              raise SystemExit(
                  f'unexpected staged paths: missing={sorted(expected-staged)} '
                  f'extra={sorted(staged-expected)}'
              )
          PY
          git diff --cached --check
      - name: Build strict native extensions and qualify lifecycle admission
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          STAQTAPP_TDS_BUILD_NATIVE: '1'
          CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel pytest numpy PyQt5
          python setup.py build_ext --inplace --force
          PYTHONPATH=src python -m pytest -q --disable-warnings -c /dev/null \
            tests/test_v360_native_lifecycle_admission.py \
            tests/test_v360_frozen_packed_index.py \
            tests/test_v360_handle_generation_truth.py \
            tests/test_v360_diagnostic_ring_truth.py \
            tests/test_v360_checksum_utf8_truth.py \
            tests/test_v360_native_csv_input_safety.py \
            tests/test_v346_csv_native_scan_kernel_prototype.py \
            tests/test_v347_csv_native_row_anchor_kernel.py
          cc -std=c11 $(python3-config --cflags) \
            -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
            tools/subinterpreter_v360_native_admission.c \
            -o /tmp/subinterpreter-v360-native-admission \
            $(python3-config --embed --ldflags)
          /tmp/subinterpreter-v360-native-admission
          rm -rf build
          find src -maxdepth 3 -type f \
            \( -name '*.so' -o -name '*.pyd' -o -name '*.dll' -o -name '*.dylib' \) \
            -delete
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/check_release.py
          git diff --cached --check
      - name: Commit qualified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'staqtapp-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add fail-closed native lifecycle admission policies'
          git push origin HEAD:agent/v360-native-lifecycle-admission
