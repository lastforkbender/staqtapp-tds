name: Staqtapp-TDS Eaglegate exactness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/v380-phase1-phase4-convergence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaglegate-exactness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exactness-contract:
    name: Exactness contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e .[test]
      - name: Compile the complete Eaglegate package
        run: python -m compileall -q src/staqtapp_tds/eaglegate
      - name: Run foundation, exactness, workflow, and installation contracts
        run: >-
          python -m pytest -q
          tests/test_v380_eaglegate_lossless_foundation.py
          tests/test_v380_eaglegate_generation_authority.py
          tests/test_v380_eaglegate_workflow_contract.py
          tests/test_v380_eaglegate_exactness_laboratory.py
          tests/test_v380_eaglegate_exactness_workflow_contract.py
          tests/test_install_contract.py
      - name: Generate deterministic content-free evidence twice
        shell: bash
        run: |
          set -euo pipefail
          python -m staqtapp_tds.eaglegate.exactness --json > exactness-a.json
          python -m staqtapp_tds.eaglegate.exactness --json > exactness-b.json
          cmp exactness-a.json exactness-b.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("exactness-a.json").read_text(encoding="utf-8"))
          if report.get("passed") is not True:
              raise SystemExit("exactness report did not pass")
          if report.get("activation_authority") is not False:
              raise SystemExit("exactness evidence widened authority")
          if report.get("check_count") != 10:
              raise SystemExit("exactness case catalog changed unexpectedly")
          forbidden = {
              "prompt", "prompt_text", "tokens", "token_sequence", "logits",
              "logits_payload", "hidden_states", "kv_tensor", "kv_tensors",
          }

          def keys(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield key
                      yield from keys(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from keys(item)

          leaked = sorted(forbidden.intersection(keys(report)))
          if leaked:
              raise SystemExit(f"content-bearing evidence keys present: {leaked}")
          print(report["report_root"])
          PY
      - name: Archive exactness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eaglegate-exactness-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            exactness-a.json
            exactness-b.json
          if-no-files-found: warn

  exactness-gates-complete:
    name: Eaglegate exactness gates complete
    if: always()
    needs:
      - exactness-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every exactness lane
        env:
          EXACTNESS_RESULT: ${{ needs.exactness-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXACTNESS_RESULT" = "success"
