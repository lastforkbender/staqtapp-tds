name: Staqtapp-TDS Eaglegate foundation

on:
  pull_request:
    branches:
      - main
      - agent/v370-atomic-csv-reference
  push:
    branches:
      - agent/eaglegate-lossless-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaglegate-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lossless-contract:
    name: Lossless contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e .[test]
      - name: Compile the complete Eaglegate package
        run: python -m compileall -q src/staqtapp_tds/eaglegate
      - name: Run lossless foundation and installation contracts
        run: >-
          python -m pytest -q
          tests/test_v380_eaglegate_lossless_foundation.py
          tests/test_v380_eaglegate_workflow_contract.py
          tests/test_install_contract.py

  lossless-gates-complete:
    name: Eaglegate lossless gates complete
    if: always()
    needs:
      - lossless-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every focused contract lane
        env:
          CONTRACT_RESULT: ${{ needs.lossless-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = "success"
