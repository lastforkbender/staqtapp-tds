name: Staqtapp-TDS release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-release-checks:
    name: Source release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check source release hygiene
        run: python scripts/check_release.py
      - name: Verify generated documentation is current
        run: git diff --exit-code

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package for tests
        run: python -m pip install ".[test]"
      - name: Run authoritative monolithic test suite
        run: python -m pytest -q --disable-warnings

  platform-compatibility:
    name: ${{ matrix.os }} pure-Python compatibility
    needs: source-release-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package for tests
        run: python -m pip install ".[test]"
      - name: Run authoritative monolithic test suite
        run: python -m pytest -q --disable-warnings

  native-extension-qualification:
    name: ${{ matrix.os }} native extensions
    needs: source-release-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install native extensions
        run: python -m pip install ".[test]"
      - name: Require both native modules
        run: python -c "from staqtapp_tds import _native_index, _csv_scan_kernel; assert _native_index and _csv_scan_kernel"
      - name: Run suite with native extensions active
        run: python -m pytest -q --disable-warnings -c /dev/null tests

  native-sanitizer-qualification:
    name: Native ${{ matrix.sanitizer }} sanitizer
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      STAQTAPP_TDS_SANITIZE: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require strict native C compilation
        if: matrix.sanitizer == 'undefined'
        shell: bash
        run: |
          for source in \
            src/staqtapp_tds/_native_index.c \
            src/staqtapp_tds/_csv_scan_kernel.c
          do
            cc -std=c11 -fsyntax-only $(python3-config --includes) \
              -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
              -Wno-cast-function-type "$source"
          done
      - name: Build and install sanitized native extensions
        run: python -m pip install ".[test]"
      - name: Run bounded native CSV sanitizer qualification
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_v360_handle_generation_truth.py
            tests/test_v360_diagnostic_ring_truth.py
            tests/test_v360_checksum_utf8_truth.py
            tests/test_v360_native_csv_input_safety.py
            tests/test_v346_csv_native_scan_kernel_prototype.py
            tests/test_v347_csv_native_row_anchor_kernel.py
            tests/test_v348_csv_kernel_performance_gates.py
          )
          if [[ "$STAQTAPP_TDS_SANITIZE" == "address" ]]; then
            asan_runtime="$(gcc -print-file-name=libasan.so)"
            test -n "$asan_runtime"
            LD_PRELOAD="$asan_runtime" \
              ASAN_OPTIONS="detect_leaks=0:halt_on_error=1:abort_on_error=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          else
            UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          fi

  build-distributions:
    name: Build and inspect distributions
    needs:
      - python-compatibility
      - platform-compatibility
      - native-extension-qualification
      - native-sanitizer-qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build source and universal wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          python scripts/release_version.py --verify-installed
      - name: Archive validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: staqtapp-tds-distributions
          path: dist/*
          if-no-files-found: error

  release-gates-complete:
    name: Release gates complete
    if: always()
    needs:
      - source-release-checks
      - python-compatibility
      - platform-compatibility
      - native-extension-qualification
      - native-sanitizer-qualification
      - build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          SOURCE_RESULT: ${{ needs.source-release-checks.result }}
          PYTHON_RESULT: ${{ needs.python-compatibility.result }}
          PLATFORM_RESULT: ${{ needs.platform-compatibility.result }}
          NATIVE_RESULT: ${{ needs.native-extension-qualification.result }}
          SANITIZER_RESULT: ${{ needs.native-sanitizer-qualification.result }}
          DISTRIBUTION_RESULT: ${{ needs.build-distributions.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "source": os.environ["SOURCE_RESULT"],
              "python": os.environ["PYTHON_RESULT"],
              "platform": os.environ["PLATFORM_RESULT"],
              "native": os.environ["NATIVE_RESULT"],
              "sanitizer": os.environ["SANITIZER_RESULT"],
              "distribution": os.environ["DISTRIBUTION_RESULT"],
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"release gates did not all succeed: {failed}")
          print("all release gates succeeded")
          PY

  publish-pypi:
    name: Publish validated distributions to PyPI
    if: github.ref_type == 'tag'
    needs: release-gates-complete
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/staqtapp-tds
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: staqtapp-tds-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0
