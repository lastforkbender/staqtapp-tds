name: Staqtapp-TDS release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TDS_V360_NATIVE_ARCHITECTURE_ROOT: d2e839477d432cdf9e328982e6e9a245295dd05c80ddac4937232c0b72bc9d09

jobs:
  source-release-checks:
    name: Source release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check source release hygiene
        run: python scripts/check_release.py
      - name: Check PyPI README screenshot contract
        run: python scripts/check_pypi_readme.py
      - name: Verify generated documentation is current
        run: git diff --exit-code

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package for tests
        run: python -m pip install ".[test]"
      - name: Run authoritative monolithic test suite
        run: python -m pytest -q --disable-warnings

  platform-compatibility:
    name: ${{ matrix.os }} pure-Python compatibility
    needs: source-release-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package for tests
        run: python -m pip install ".[test]"
      - name: Run authoritative monolithic test suite
        run: python -m pytest -q --disable-warnings

  native-extension-qualification:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} native extensions
    needs: source-release-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.13'
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install native extensions
        run: python -m pip install ".[test]"
      - name: Require both native modules
        run: python -c "from staqtapp_tds import _native_index, _csv_scan_kernel; assert _native_index and _csv_scan_kernel"
      - name: Run suite with native extensions active
        run: python -m pytest -q --disable-warnings -c /dev/null tests

  native-sanitizer-qualification:
    name: Native ${{ matrix.sanitizer }} sanitizer
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      STAQTAPP_TDS_SANITIZE: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require strict native C compilation
        if: matrix.sanitizer == 'undefined'
        shell: bash
        run: |
          for source in \
            src/staqtapp_tds/_native_index.c \
            src/staqtapp_tds/_csv_scan_kernel.c
          do
            cc -std=c11 -fsyntax-only $(python3-config --includes) \
              -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
              -Wno-cast-function-type "$source"
          done
      - name: Build and install sanitized native extensions
        run: python -m pip install ".[test]"
      - name: Run bounded native CSV sanitizer qualification
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_v360_frozen_packed_index.py
            tests/test_v360_native_lifecycle_admission.py
            tests/test_v360_handle_generation_truth.py
            tests/test_v360_diagnostic_ring_truth.py
            tests/test_v360_checksum_utf8_truth.py
            tests/test_v360_native_csv_input_safety.py
            tests/test_v346_csv_native_scan_kernel_prototype.py
            tests/test_v347_csv_native_row_anchor_kernel.py
            tests/test_v348_csv_kernel_performance_gates.py
          )
          if [[ "$STAQTAPP_TDS_SANITIZE" == "address" ]]; then
            asan_runtime="$(gcc -print-file-name=libasan.so)"
            test -n "$asan_runtime"
            LD_PRELOAD="$asan_runtime" \
              ASAN_OPTIONS="detect_leaks=0:halt_on_error=1:abort_on_error=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          else
            UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          fi

  native-thread-sanitizer-qualification:
    name: Native frozen-index thread sanitizer
    needs: source-release-checks
    runs-on: ubuntu-latest
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      STAQTAPP_TDS_SANITIZE: thread
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build ThreadSanitizer native extensions
        run: |
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Run direct extension-only frozen-index concurrency harness
        shell: bash
        run: |
          set -euo pipefail
          tsan_runtime="$(gcc -print-file-name=libtsan.so)"
          test -n "$tsan_runtime"
          LD_PRELOAD="$tsan_runtime" \
            TSAN_OPTIONS="halt_on_error=1:history_size=7:second_deadlock_stack=1" \
            PYTHONPATH=src python -S tools/tsan_v360_frozen_index.py

  native-lifecycle-admission-qualification:
    name: Python ${{ matrix.python-version }} native lifecycle admission
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build strict native extensions
        run: |
          python -m pip install setuptools wheel pytest numpy PyQt5
          python setup.py build_ext --inplace --force
      - name: Run lifecycle policy qualification
        run: >-
          PYTHONPATH=src python -m pytest -q --disable-warnings -c /dev/null
          tests/test_v360_native_lifecycle_admission.py
          tests/test_v360_frozen_packed_index.py
      - name: Compile and run subinterpreter rejection harness
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 $(python3-config --cflags) \
            -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
            tools/subinterpreter_v360_native_admission.c \
            -o /tmp/subinterpreter-v360-native-admission \
            $(python3-config --embed --ldflags)
          /tmp/subinterpreter-v360-native-admission

  native-free-threaded-admission-qualification:
    name: Python ${{ matrix.python-version }} free-threaded native admission
    needs: source-release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13t', '3.14t']
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Report free-threaded interpreter
        run: python -VV
      - name: Build extension for the free-threaded ABI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Verify explicit compatibility-GIL admission
        run: python -X gil=0 -S tools/free_threaded_v360_native_admission.py

  native-frozen-format-fuzz:
    name: Native frozen-index deterministic fuzz
    needs: source-release-checks
    runs-on: ubuntu-latest
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build native extensions
        run: python -m pip install ".[test]"
      - name: Replay pinned valid and malformed packed requests
        shell: bash
        run: |
          set -euo pipefail
          python tools/fuzz_v360_frozen_index.py --seed 3542816 --cases 5000 \
            > native-frozen-index-fuzz.json
          cat native-frozen-index-fuzz.json
      - name: Archive deterministic fuzz evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-frozen-index-fuzz
          path: native-frozen-index-fuzz.json
          if-no-files-found: error

  native-frozen-performance-evidence:
    name: Native frozen-index two-worker evidence
    needs: source-release-checks
    runs-on: ubuntu-latest
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build native extensions
        run: python -m pip install ".[test]"
      - name: Require shared-runner aggregate no-regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/benchmark_v360_frozen_index.py \
            --keys 4096 \
            --iterations 128 \
            --samples 7 \
            --min-two-worker-factor 1.0 \
            > native-frozen-index-performance.json
          cat native-frozen-index-performance.json
      - name: Archive separate performance evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-frozen-index-performance
          path: native-frozen-index-performance.json
          if-no-files-found: error

  native-architecture-semantic-evidence:
    name: Native ${{ matrix.architecture }} semantic evidence
    needs: source-release-checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    env:
      STAQTAPP_TDS_BUILD_NATIVE: '1'
      CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Record native runner identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          python -VV
          getconf LONG_BIT
          lscpu || true
      - name: Build strict in-tree native extensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools wheel pytest
          python setup.py build_ext --inplace --force
      - name: Produce pinned native semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          python -S tools/architecture_parity_v360_native.py \
            --expected-architecture '${{ matrix.architecture }}' \
            --expected-root "$TDS_V360_NATIVE_ARCHITECTURE_ROOT" \
            --output 'native-architecture-${{ matrix.architecture }}.json'
          python -m pytest -q --disable-warnings -c /dev/null \
            tests/test_v360_native_architecture_parity.py
      - name: Archive architecture evidence even on mismatch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-architecture-${{ matrix.architecture }}
          path: native-architecture-${{ matrix.architecture }}.json
          if-no-files-found: error

  native-architecture-parity-comparison:
    name: Native x86-64 and AArch64 semantic parity
    if: always()
    needs: native-architecture-semantic-evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: native-architecture-x86_64
          path: native-architecture-reports/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: native-architecture-aarch64
          path: native-architecture-reports/aarch64
      - name: Require exact native semantic parity
        shell: bash
        run: |
          set -euo pipefail
          python -S tools/architecture_parity_v360_native.py \
            --compare \
              native-architecture-reports/x86_64/native-architecture-x86_64.json \
              native-architecture-reports/aarch64/native-architecture-aarch64.json \
            --expected-root "$TDS_V360_NATIVE_ARCHITECTURE_ROOT" \
            --output native-architecture-comparison.json
          cat native-architecture-comparison.json
      - name: Archive parity comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-architecture-parity-comparison
          path: native-architecture-comparison.json
          if-no-files-found: error

  build-distributions:
    name: Build and inspect distributions
    needs:
      - python-compatibility
      - platform-compatibility
      - native-extension-qualification
      - native-sanitizer-qualification
      - native-thread-sanitizer-qualification
      - native-lifecycle-admission-qualification
      - native-free-threaded-admission-qualification
      - native-frozen-format-fuzz
      - native-frozen-performance-evidence
      - native-architecture-parity-comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build source and universal wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_pypi_readme.py --network --wheel dist/*.whl
          python -m pip install --force-reinstall dist/*.whl
          python scripts/release_version.py --verify-installed
      - name: Archive validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: staqtapp-tds-distributions
          path: dist/*
          if-no-files-found: error

  release-gates-complete:
    name: Release gates complete
    if: always()
    needs:
      - source-release-checks
      - python-compatibility
      - platform-compatibility
      - native-extension-qualification
      - native-sanitizer-qualification
      - native-thread-sanitizer-qualification
      - native-lifecycle-admission-qualification
      - native-free-threaded-admission-qualification
      - native-frozen-format-fuzz
      - native-frozen-performance-evidence
      - native-architecture-parity-comparison
      - build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          SOURCE_RESULT: ${{ needs.source-release-checks.result }}
          PYTHON_RESULT: ${{ needs.python-compatibility.result }}
          PLATFORM_RESULT: ${{ needs.platform-compatibility.result }}
          NATIVE_RESULT: ${{ needs.native-extension-qualification.result }}
          SANITIZER_RESULT: ${{ needs.native-sanitizer-qualification.result }}
          THREAD_SANITIZER_RESULT: ${{ needs.native-thread-sanitizer-qualification.result }}
          LIFECYCLE_RESULT: ${{ needs.native-lifecycle-admission-qualification.result }}
          FREE_THREADED_RESULT: ${{ needs.native-free-threaded-admission-qualification.result }}
          FUZZ_RESULT: ${{ needs.native-frozen-format-fuzz.result }}
          PERFORMANCE_RESULT: ${{ needs.native-frozen-performance-evidence.result }}
          ARCHITECTURE_RESULT: ${{ needs.native-architecture-parity-comparison.result }}
          DISTRIBUTION_RESULT: ${{ needs.build-distributions.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "source": os.environ["SOURCE_RESULT"],
              "python": os.environ["PYTHON_RESULT"],
              "platform": os.environ["PLATFORM_RESULT"],
              "native": os.environ["NATIVE_RESULT"],
              "sanitizer": os.environ["SANITIZER_RESULT"],
              "thread_sanitizer": os.environ["THREAD_SANITIZER_RESULT"],
              "lifecycle": os.environ["LIFECYCLE_RESULT"],
              "free_threaded_admission": os.environ["FREE_THREADED_RESULT"],
              "fuzz": os.environ["FUZZ_RESULT"],
              "performance": os.environ["PERFORMANCE_RESULT"],
              "architecture_parity": os.environ["ARCHITECTURE_RESULT"],
              "distribution": os.environ["DISTRIBUTION_RESULT"],
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"release gates did not all succeed: {failed}")
          print("all release gates succeeded")
          PY

  publish-pypi:
    name: Publish validated distributions to PyPI
    if: github.ref_type == 'tag'
    needs: release-gates-complete
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/staqtapp-tds
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: staqtapp-tds-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0
