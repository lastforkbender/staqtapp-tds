name: Staqtapp-TDS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staqtapp-tds-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate tag and build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Match the annotated release tag to source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/tags/v3.8.3"
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git rev-parse HEAD^)" = "0364f8db2d0775019398f3a0d4b3bea06da96b4b"
          fi
          python scripts/release_version.py --check-tag "$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Build one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          python -m twine check dist/*
          python scripts/check_pypi_readme.py --wheel dist/*.whl
      - name: Install and verify the built wheel
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/tds-release-wheel"
          python -m venv "$smoke_root"
          "$smoke_root/bin/python" -m pip install dist/*.whl
          "$smoke_root/bin/python" -m pip check
          "$smoke_root/bin/python" -I scripts/release_version.py --verify-installed
      - name: Upload distributions for the publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staqtapp-tds-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/staqtapp-tds
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: staqtapp-tds-distributions-${{ github.sha }}
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist

  smoke:
    name: ${{ matrix.os }} production install
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install the exact public wheel
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="staqtapp-tds==$version"
          for attempt in $(seq 1 12); do
            if python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --only-binary=:all: \
              --index-url https://pypi.org/simple \
              "$package"
            then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              exit 1
            fi
            sleep 10
          done
          python -m pip check
      - name: Verify installed identity and core round trip
        shell: bash
        run: |
          python -I - <<'PY'
          import importlib.metadata as metadata
          import os

          from staqtapp_tds import TDSFileSystem, __version__

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          assert metadata.version("staqtapp-tds") == expected
          assert __version__ == expected
          fs = TDSFileSystem("production_smoke")
          node = fs.makedirs("/release")
          node.write_text("status", "published")
          assert node.read_value("status") == "published"
          PY
  github-release:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download the published distribution set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: staqtapp-tds-distributions-${{ github.sha }}
          path: dist
      - name: Create the public GitHub Release
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --title "Staqtapp-TDS $RELEASE_TAG"
          --generate-notes
          dist/*
