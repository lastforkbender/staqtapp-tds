name: Staqtapp-TDS v3.8.1 candidate Phase 5 fixed-point path reference oracle

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/v381-fixed-point-path-planner
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v381-fixed-point-path-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-point-path-reference:
    name: Fixed-point reference (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Generation and Trace Rank packages
        run: >-
          python -m compileall -q
          src/staqtapp_tds/generation
          src/staqtapp_tds/trace_rank
      - name: Run ABI, CSV Generation, graph, planner, workflow, and install gates
        run: >-
          python -m pytest -q
          tests/test_v360_trace_rank_contract.py
          tests/test_v370_csv_generation.py
          tests/test_v380_packed_waypoint_graph.py
          tests/test_v381_fixed_point_path_planner.py
          tests/test_v381_fixed_point_path_workflow_contract.py
          tests/test_install_contract.py

  fixed-point-path-gates-complete:
    name: TDS v3.8.1 candidate Phase 5 fixed-point path gates complete
    if: always()
    needs:
      - fixed-point-path-reference
    runs-on: ubuntu-24.04
    steps:
      - name: Require every reference-oracle lane
        env:
          RESULT: ${{ needs.fixed-point-path-reference.result }}
        run: test "$RESULT" = "success"
