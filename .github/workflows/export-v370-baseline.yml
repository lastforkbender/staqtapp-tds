name: Export v3.7 clean baseline

on:
  pull_request:
    branches:
      - agent/v360-foundation-closure-clean
  push:
    branches:
      - agent/v370-generation-convergence

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v370-generation-convergence
      - name: Archive clean repository baseline
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/v370-clean-baseline.tar.gz .
          sha256sum /tmp/v370-clean-baseline.tar.gz > /tmp/v370-clean-baseline.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: v370-clean-baseline
          path: |
            /tmp/v370-clean-baseline.tar.gz
            /tmp/v370-clean-baseline.sha256
          if-no-files-found: error
          retention-days: 2
