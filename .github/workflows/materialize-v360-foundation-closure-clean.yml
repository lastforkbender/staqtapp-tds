name: Materialize clean v3.6 Foundation Closure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/v360-foundation-closure-clean

permissions:
  contents: write

concurrency:
  group: materialize-v360-foundation-closure-clean
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/v360-foundation-closure-clean
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconstruct and verify the locally qualified patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.github').glob('v360-foundation-closure.patch.part-*'))
          if len(parts) != 22:
              raise SystemExit(f'expected 22 transfer parts, found {len(parts)}')
          chunks = [b''.join(path.read_bytes().split()) for path in parts]

          part02_index = parts.index(Path('.github/v360-foundation-closure.patch.part-02'))
          part02 = bytearray(chunks[part02_index])
          required = {
              3336: (ord('f'), ord('m')),
              3478: (ord('_'), ord('/')),
              5054: (ord('_'), ord('/')),
          }
          for position, (before, after) in required.items():
              if part02[position] != before:
                  raise SystemExit(
                      f'unexpected part-02 byte at {position}: {part02[position]}'
                  )
              part02[position] = after
          chunks[part02_index] = bytes(part02)

          part08_index = parts.index(Path('.github/v360-foundation-closure.patch.part-08'))
          if len(chunks[part08_index]) != 11999:
              raise SystemExit('part 08 no longer has the qualified transfer shape')
          chunks[part08_index] += b'A'

          encoded = b''.join(chunks)
          if len(encoded) != 137536:
              raise SystemExit(f'encoded transfer length mismatch: {len(encoded)}')
          decoded = base64.b64decode(encoded, validate=True)
          if len(decoded) != 103151:
              raise SystemExit(f'decoded transfer length mismatch: {len(decoded)}')

          malformed = b'\n---- a/tests/test_v313_runtime_manager.py\n'
          corrected = b'\n--- a/tests/test_v313_runtime_manager.py\n'
          if decoded.count(malformed) != 1:
              raise SystemExit('runtime-manager header repair is not unique')
          decoded = decoded.replace(malformed, corrected, 1)

          expected_length = 103150
          expected_sha256 = (
              'ce934de425e73e06c8b2d209947a4f1dea32c110a6310668e68728c2e3473a10'
          )
          actual_sha256 = hashlib.sha256(decoded).hexdigest()
          if len(decoded) != expected_length:
              raise SystemExit(f'clean patch length mismatch: {len(decoded)}')
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'clean patch digest mismatch: {actual_sha256}')
          Path('/tmp/closure.patch').write_bytes(decoded)
          print(f'clean patch bytes: {len(decoded)}')
          print(f'clean patch sha256: {actual_sha256}')
          PY
          git apply --check --whitespace=nowarn /tmp/closure.patch
          git apply --whitespace=nowarn /tmp/closure.patch
          rm -f .github/v360-foundation-closure.patch.part-*
          rm -f .github/v360-foundation-closure-clean.trigger*
          rm -f .github/workflows/materialize-v360-foundation-closure-clean.yml
          git diff --check
          python -S tools/foundation_closure_v360.py --root . --json > /tmp/foundation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/foundation.json').read_text(encoding='utf-8'))
          if report.get('passed') is not True:
              raise SystemExit('Foundation Closure report did not pass')
          if report.get('release_identity') != '3.6.0':
              raise SystemExit('Foundation Closure report did not bind 3.6.0')
          if report.get('eaglegate_included') is not False:
              raise SystemExit('Foundation Closure improperly admitted Eaglegate')
          if report.get('atomic_generation_plane_included') is not False:
              raise SystemExit('Foundation Closure improperly admitted Atomic Generations')
          print(report['report_root'])
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          python scripts/check_release.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit the clean Foundation Closure source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close v3.6 Foundation Repair'
          git push origin HEAD:agent/v360-foundation-closure-clean
