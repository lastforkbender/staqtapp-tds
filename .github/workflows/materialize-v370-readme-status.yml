name: Materialize v3.7 README current status

on:
  push:
    branches:
      - agent/v370-atomic-generation-convergence

permissions:
  contents: write

concurrency:
  group: materialize-v370-readme-status
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v370-atomic-generation-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply additive README status blocks and preserve targets
        shell: bash
        run: |
          set -euo pipefail
          python tools/update_readme_status_v370.py --apply
          python tools/update_readme_status_v370.py --check
          rm -f .github/workflows/materialize-v370-readme-status.yml
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/materialize-v370-readme-status.yml",
              "README.md",
              "README_ja.md",
              "docs/readme_targets_v370.json",
          }
          observed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = observed - allowed
          required = {"README.md", "README_ja.md", "docs/readme_targets_v370.json"}
          if unexpected:
              raise SystemExit(f"unexpected README materialization changes: {sorted(unexpected)}")
          if not required.issubset(observed):
              raise SystemExit(f"README materialization missed files: {sorted(required - observed)}")
          PY
          git diff --check
      - name: Commit clean README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README_ja.md docs/readme_targets_v370.json \
            .github/workflows/materialize-v370-readme-status.yml
          git commit -m 'Update README status for v3.7 Atomic Generation'
          git push origin HEAD:agent/v370-atomic-generation-convergence
