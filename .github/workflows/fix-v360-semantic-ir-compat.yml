name: Fix v3.6 Semantic IR compatibility assertion

on:
  push:
    branches:
      - agent/v360-foundation-closure-clean

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NUMBA_DISABLE_JIT: '1'

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v360-foundation-closure-clean
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Correct stale v3.5.3 replay expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_v352_csv_semantic_ir_atomic_batch.py')
          text = path.read_text(encoding='utf-8')
          old = 'compatible_release_replay:3.5.1->3.5.3'
          new = 'compatible_release_replay:3.5.1->3.6.0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python -m pip install -e .[test]
          python -m pytest -q \
            tests/test_v352_csv_semantic_ir_atomic_batch.py::test_v351_serialized_candidate_and_lifecycle_are_accepted_compatibly
          git diff --check
      - name: Commit corrected compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v352_csv_semantic_ir_atomic_batch.py
          git commit -m 'Align Semantic IR replay warning with v3.6.0'
          git push origin HEAD:agent/v360-foundation-closure-clean
