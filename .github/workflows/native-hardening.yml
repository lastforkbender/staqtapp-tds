name: Staqtapp-TDS native hardening

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staqtapp-tds-native-hardening
  cancel-in-progress: false

env:
  TDS_V360_NATIVE_ARCHITECTURE_ROOT: d2e839477d432cdf9e328982e6e9a245295dd05c80ddac4937232c0b72bc9d09
  STAQTAPP_TDS_BUILD_NATIVE: '1'
  CFLAGS: '-std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic -Wno-cast-function-type'

jobs:
  sanitizers:
    name: Native ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      STAQTAPP_TDS_SANITIZE: ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Build sanitized native extensions
        run: python -m pip install ".[test]"
      - name: Run bounded sanitizer suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_v360_frozen_packed_index.py
            tests/test_v360_native_lifecycle_admission.py
            tests/test_v360_handle_generation_truth.py
            tests/test_v360_diagnostic_ring_truth.py
            tests/test_v360_checksum_utf8_truth.py
            tests/test_v360_native_csv_input_safety.py
            tests/test_v346_csv_native_scan_kernel_prototype.py
            tests/test_v347_csv_native_row_anchor_kernel.py
            tests/test_v348_csv_kernel_performance_gates.py
          )
          if [[ "$STAQTAPP_TDS_SANITIZE" == "address" ]]; then
            asan_runtime="$(gcc -print-file-name=libasan.so)"
            test -n "$asan_runtime"
            LD_PRELOAD="$asan_runtime" \
              ASAN_OPTIONS="detect_leaks=0:halt_on_error=1:abort_on_error=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          else
            UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              python -m pytest -q --disable-warnings -c /dev/null "${tests[@]}"
          fi

  thread-sanitizer:
    name: Native thread sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAQTAPP_TDS_SANITIZE: thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build ThreadSanitizer native extensions
        run: |
          python -m pip install setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Run direct native concurrency harness
        shell: bash
        run: |
          set -euo pipefail
          tsan_runtime="$(gcc -print-file-name=libtsan.so)"
          test -n "$tsan_runtime"
          LD_PRELOAD="$tsan_runtime" \
            TSAN_OPTIONS="halt_on_error=1:history_size=7:second_deadlock_stack=1" \
            PYTHONPATH=src python -S tools/tsan_v360_frozen_index.py

  deterministic-fuzz:
    name: Native deterministic format fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Build native extensions
        run: python -m pip install ".[test]"
      - name: Replay pinned valid and malformed requests
        run: >-
          python tools/fuzz_v360_frozen_index.py
          --seed 3542816 --cases 5000

  free-threaded-admission:
    name: Python ${{ matrix.python-version }} free-threaded admission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build extension for the free-threaded ABI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace --force
      - name: Verify explicit compatibility-GIL admission
        run: >-
          PYTHONPATH=src python -X gil=0 -S
          tools/free_threaded_v360_native_admission.py

  lifecycle-admission:
    name: Native lifecycle and subinterpreter admission
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Build strict native extensions
        run: |
          python -m pip install setuptools wheel pytest numpy PyQt5
          python setup.py build_ext --inplace --force
      - name: Run lifecycle tests
        run: >-
          PYTHONPATH=src python -m pytest -q --disable-warnings -c /dev/null
          tests/test_v360_native_lifecycle_admission.py
          tests/test_v360_frozen_packed_index.py
      - name: Compile and run subinterpreter rejection harness
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 $(python3-config --cflags) \
            -Wall -Wextra -Werror -Wconversion -Wshadow -Wpedantic \
            tools/subinterpreter_v360_native_admission.c \
            -o /tmp/subinterpreter-v360-native-admission \
            $(python3-config --embed --ldflags)
          /tmp/subinterpreter-v360-native-admission

  architecture-evidence:
    name: Native ${{ matrix.architecture }} semantic evidence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build strict native extensions
        run: |
          python -m pip install setuptools wheel pytest
          python setup.py build_ext --inplace --force
      - name: Produce native semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -S tools/architecture_parity_v360_native.py \
            --expected-architecture '${{ matrix.architecture }}' \
            --expected-root "$TDS_V360_NATIVE_ARCHITECTURE_ROOT" \
            --output 'native-architecture-${{ matrix.architecture }}.json'
      - name: Run bounded AArch64 soak and fuzz
        if: matrix.architecture == 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -S tools/aarch64_hardening_v360.py \
            --expected-architecture aarch64 \
            --loops 256 --keys 8192 --workers 4 --iterations 128 \
            --output aarch64-hardening.json
          PYTHONPATH=src python -S tools/aarch64_fuzz_v360.py \
            --expected-architecture aarch64 \
            --seed 36018 --cases 10000 \
            --output aarch64-native-fuzz.json
      - name: Upload architecture evidence for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-architecture-${{ matrix.architecture }}
          path: native-architecture-${{ matrix.architecture }}.json
          if-no-files-found: error

  architecture-parity:
    name: Native x86-64 and AArch64 semantic parity
    needs: architecture-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-architecture-x86_64
          path: native-architecture-reports/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-architecture-aarch64
          path: native-architecture-reports/aarch64
      - name: Require exact semantic parity
        run: >-
          PYTHONPATH=src python -S tools/architecture_parity_v360_native.py
          --compare
          native-architecture-reports/x86_64/native-architecture-x86_64.json
          native-architecture-reports/aarch64/native-architecture-aarch64.json
          --expected-root "$TDS_V360_NATIVE_ARCHITECTURE_ROOT"
