name: v3.8.2 one-time release controller

on:
  workflow_run:
    workflows:
      - Staqtapp-TDS release gates
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: staqtapp-tds-v3.8.2-release-controller
  cancel-in-progress: false

jobs:
  validate-qualified-source:
    name: Validate exact qualified source without a persisted token
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    env:
      RELEASE_VERSION: '3.8.2'
      RELEASE_TAG: v3.8.2
      QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # actions/checkout v7.0.1; deliberately pinned in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retire safely outside the one-time source identity
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail
          actual="$(python scripts/release_version.py)"
          if [[ "$actual" != "$RELEASE_VERSION" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "controller retired for source version $actual"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "controller retired because $RELEASE_TAG already exists"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            python scripts/check_release.py
          git diff --exit-code
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  mutate-release:
    name: Create exact annotated tag and dispatch exact tag run
    needs: validate-qualified-source
    if: needs.validate-qualified-source.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Revalidate qualified run, mutate tag, and dispatch once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: '3.8.2'
          RELEASE_TAG: v3.8.2
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          CONTROLLER_RUN_ID: ${{ github.run_id }}
          CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          sha = os.environ["QUALIFIED_SHA"]
          run_id = int(os.environ["QUALIFIED_RUN_ID"])
          controller_run_id = int(os.environ["CONTROLLER_RUN_ID"])
          controller_run_attempt = int(os.environ["CONTROLLER_RUN_ATTEMPT"])
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "staqtapp-tds-v382-release-controller",
          }

          if tag != f"v{version}" or version != "3.8.2":
              raise SystemExit("controller is bound only to exact v3.8.2")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("qualified SHA is not an exact commit identity")
          if controller_run_id <= 0 or controller_run_attempt <= 0:
              raise SystemExit("controller run identity is invalid")

          def api(method, path, payload=None, expected=(200,)):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  base + path,
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read()
                      status = response.status
              except HTTPError as exc:
                  raw = exc.read()
                  status = exc.code
              if status not in expected:
                  raise SystemExit(
                      f"{method} {path} returned {status}: {raw[:500]!r}"
                  )
              return status, json.loads(raw) if raw else None

          def require_qualified_run(run):
              required = {
                  "id": run_id,
                  "path": ".github/workflows/release.yml",
                  "event": "push",
                  "head_branch": "main",
                  "head_sha": sha,
                  "status": "completed",
                  "conclusion": "success",
              }
              for key, value in required.items():
                  actual = run.get(key)
                  if (
                      type(value) is int and type(actual) is not int
                  ) or actual != value:
                      raise SystemExit(
                          f"qualified workflow mismatch for {key}: "
                          f"{actual!r}"
                      )
              for key in ("repository", "head_repository"):
                  if run.get(key, {}).get("full_name") != repo:
                      raise SystemExit(
                          f"qualified workflow has the wrong {key} provenance"
                      )
              workflow_id = run.get("workflow_id")
              if isinstance(workflow_id, bool) or not isinstance(workflow_id, int):
                  raise SystemExit("qualified workflow lacks an exact workflow ID")
              return workflow_id

          def require_dispatch_response(status, payload):
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit(
                      "workflow dispatch did not return exact run details"
                  )
              value = payload.get("workflow_run_id")
              if isinstance(value, bool) or not isinstance(value, int):
                  raise SystemExit(
                      "workflow dispatch omitted workflow_run_id"
                  )
              if value <= 0:
                  raise SystemExit("workflow dispatch returned an invalid run ID")
              return value

          def require_dispatched_run(run, dispatch_run_id, workflow_id):
              required = {
                  "id": dispatch_run_id,
                  "run_attempt": 1,
                  "workflow_id": workflow_id,
                  "path": ".github/workflows/release.yml",
                  "event": "workflow_dispatch",
                  "head_sha": sha,
              }
              for key, value in required.items():
                  actual = run.get(key)
                  if (
                      type(value) is int and type(actual) is not int
                  ) or actual != value:
                      raise SystemExit(
                          f"dispatched release run mismatch for {key}: "
                          f"{actual!r}"
                      )
              for key in ("repository", "head_repository"):
                  if run.get(key, {}).get("full_name") != repo:
                      raise SystemExit(
                          f"dispatched release run has the wrong {key} provenance"
                      )

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )["workflow_run"]
          require_qualified_run(event)

          _, qualified_run = api("GET", f"/actions/runs/{run_id}")
          workflow_id = require_qualified_run(qualified_run)

          jobs_seen = []
          page = 1
          while True:
              _, jobs = api(
                  "GET",
                  f"/actions/runs/{run_id}/jobs?filter=latest&per_page=100"
                  f"&page={page}",
              )
              jobs_seen.extend(jobs.get("jobs", []))
              if len(jobs_seen) >= int(jobs.get("total_count", 0)):
                  break
              page += 1
              if page > 10:
                  raise SystemExit("qualified job list exceeded the safety bound")
          aggregates = [
              job
              for job in jobs_seen
              if job.get("name") == "Release gates complete"
          ]
          if (
              len(aggregates) != 1
              or aggregates[0].get("status") != "completed"
              or aggregates[0].get("conclusion") != "success"
          ):
              raise SystemExit(
                  "exact main run lacks one successful Release gates complete job"
              )

          _, main_ref = api("GET", "/git/ref/heads/main")
          if (
              main_ref.get("object", {}).get("type") != "commit"
              or main_ref.get("object", {}).get("sha") != sha
          ):
              raise SystemExit(
                  "main advanced or changed after qualification; qualify the new head"
              )

          pypi_request = Request(
              f"https://pypi.org/pypi/staqtapp-tds/{version}/json",
              headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache",
                  "User-Agent": "staqtapp-tds-v382-release-controller",
              },
          )
          try:
              with urlopen(pypi_request, timeout=30) as response:
                  response.read(1)
                  status = response.status
          except HTTPError as exc:
              if exc.code != 404:
                  raise SystemExit(
                      f"PyPI absence check failed closed with HTTP {exc.code}"
                  ) from exc
          else:
              raise SystemExit(
                  f"PyPI {version} already exists (HTTP {status}); "
                  "automatic publication recovery is prohibited"
              )

          status, existing_ref = api(
              "GET",
              f"/git/ref/tags/{quote(tag, safe='')}",
              expected=(200, 404),
          )
          if status == 200:
              raise SystemExit(
                  f"{tag} already exists as {existing_ref.get('object')!r}; "
                  "automatic re-entry is prohibited"
              )

          _, tag_object = api(
              "POST",
              "/git/tags",
              {
                  "tag": tag,
                  "message": "Staqtapp-TDS v3.8.2",
                  "object": sha,
                  "type": "commit",
              },
              expected=(201,),
          )
          api(
              "POST",
              "/git/refs",
              {"ref": f"refs/tags/{tag}", "sha": tag_object["sha"]},
              expected=(201,),
          )

          _, created_ref = api(
              "GET", f"/git/ref/tags/{quote(tag, safe='')}"
          )
          if created_ref.get("object", {}).get("type") != "tag":
              raise SystemExit("created release tag is not annotated")
          _, created_tag = api(
              "GET", f"/git/tags/{created_ref['object']['sha']}"
          )
          tag_object_sha = created_ref["object"]["sha"]
          if (
              not re.fullmatch(r"[0-9a-f]{40}", tag_object_sha)
              or created_tag.get("sha") != tag_object_sha
              or created_tag.get("tag") != tag
              or created_tag.get("object", {}).get("type") != "commit"
              or created_tag.get("object", {}).get("sha") != sha
          ):
              raise SystemExit("created tag does not peel to qualified main SHA")

          status, dispatch = api(
              "POST",
              "/actions/workflows/release.yml/dispatches",
              {
                  "ref": tag,
                  "inputs": {
                      "qualified_sha": sha,
                      "qualified_run_id": str(run_id),
                      "controller_run_id": str(controller_run_id),
                      "controller_run_attempt": str(controller_run_attempt),
                  },
                  "return_run_details": True,
              },
              expected=(200,),
          )
          dispatch_run_id = require_dispatch_response(status, dispatch)
          for _ in range(12):
              time.sleep(5)
              status, dispatched_run = api(
                  "GET",
                  f"/actions/runs/{dispatch_run_id}",
                  expected=(200, 404),
              )
              if status == 404:
                  continue
              require_dispatched_run(
                  dispatched_run, dispatch_run_id, workflow_id
              )
              print("tag release gates:", dispatched_run["html_url"])
              break
          else:
              raise SystemExit(
                  "exact returned release run did not become visible; "
                  "do not retry automatically"
              )

          attestation = {
              "schema": "staqtapp-tds/v382-release-controller-attestation-1",
              "repo": repo,
              "controller_run_id": controller_run_id,
              "controller_run_attempt": controller_run_attempt,
              "release_run_id": dispatch_run_id,
              "qualified_run_id": run_id,
              "qualified_sha": sha,
              "tag": tag,
              "tag_object_sha": tag_object_sha,
          }
          Path("v382-release-controller-attestation.json").write_text(
              json.dumps(attestation, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload immutable controller-to-release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v382-release-controller-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: v382-release-controller-attestation.json
          if-no-files-found: error
          retention-days: 90
